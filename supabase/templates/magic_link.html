<!doctype html>
<html>
  <body style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #111; max-width: 480px; margin: 0 auto; padding: 24px;">
    <h2 style="margin: 0 0 16px;">Your sign-in code</h2>
    <p>Enter this code on the Breaks sign-in page:</p>
    <p style="font-size: 32px; font-weight: 600; letter-spacing: 6px; margin: 16px 0;">{{ .Token }}</p>
    <p>Or open this link and tap Continue:</p>
    <p><a href="{{ .SiteURL }}/auth/callback?token_hash={{ .TokenHash }}&type=email" style="display: inline-block; background: #111; color: #fff; padding: 12px 20px; border-radius: 6px; text-decoration: none;">Sign in to Breaks</a></p>
    <p style="color: #666; font-size: 12px;">The code and link expire in 15 minutes. If you did not ask to sign in, you can ignore this email.</p>
  </body>
</html>
